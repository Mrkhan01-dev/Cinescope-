<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineScope | Discover Movies</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Main CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Loader -->
  <div id="loader" class="loader">
    <div class="spinner"></div>
  </div>

  <!-- Header / Navbar -->
  <header class="header">
    <div class="container header-container">
      <a href="#" class="logo" id="logo">
        <i class="fa-solid fa-film"></i> CineScope
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="#" class="nav-link active" data-page="home">Home</a>
        <a href="#" class="nav-link" data-page="trending">Trending</a>
        <a href="#" class="nav-link" data-page="popular">Popular</a>
        <a href="#" class="nav-link" data-page="top-rated">Top Rated</a>
        <a href="#" class="nav-link" data-page="upcoming">Upcoming</a>
        <a href="#" class="nav-link" data-page="favorites">
          <i class="fa-solid fa-heart" style="color: #e50914;"></i> Favorites 
          <span id="favCount" class="fav-count">0</span>
        </a>
      </nav>

      <div class="header-actions">
        <div class="search-box">
          <i class="fa-solid fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search movies..." autocomplete="off">
          <button id="searchClear" class="hidden"><i class="fa-solid fa-times"></i></button>
          <div id="searchResults" class="search-results"></div>
        </div>

        <button id="themeToggle" class="icon-btn" title="Toggle Theme">
          <i class="fa-solid fa-moon"></i>
        </button>

        <button id="menuToggle" class="icon-btn mobile-only">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section id="heroSection" class="hero-section hidden">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-overlay"></div>
    <div class="container hero-container">
      <div class="hero-info" id="heroInfo"></div>
    </div>
    <div class="hero-indicators" id="heroIndicators"></div>
  </section>

  <!-- Genres Section -->
  <section class="genres-section hidden">
    <div class="container">
      <div class="genres-list" id="genresList"></div>
    </div>
  </section>

  <!-- Home Section (Grids) -->
  <main id="homeSection" class="container main-content hidden">
    <!-- Trending -->
    <div class="movie-row">
      <div class="row-header">
        <h2><i class="fa-solid fa-fire" style="color:#e50914;"></i> Trending This Week</h2>
        <a href="#" class="see-all" data-page="trending">See All <i class="fa-solid fa-arrow-right"></i></a>
      </div>
      <div class="movies-grid" id="trendingGrid"></div>
    </div>

    <!-- Popular -->
    <div class="movie-row">
      <div class="row-header">
        <h2><i class="fa-solid fa-star" style="color:#fbbf24;"></i> Popular Movies</h2>
        <a href="#" class="see-all" data-page="popular">See All <i class="fa-solid fa-arrow-right"></i></a>
      </div>
      <div class="movies-grid" id="popularGrid"></div>
    </div>

    <!-- Top Rated -->
    <div class="movie-row">
      <div class="row-header">
        <h2><i class="fa-solid fa-trophy" style="color:#38bdf8;"></i> Top Rated</h2>
        <a href="#" class="see-all" data-page="top-rated">See All <i class="fa-solid fa-arrow-right"></i></a>
      </div>
      <div class="movies-grid" id="topRatedGrid"></div>
    </div>

    <!-- Upcoming -->
    <div class="movie-row">
      <div class="row-header">
        <h2><i class="fa-solid fa-calendar-alt" style="color:#a78bfa;"></i> Upcoming</h2>
        <a href="#" class="see-all" data-page="upcoming">See All <i class="fa-solid fa-arrow-right"></i></a>
      </div>
      <div class="movies-grid" id="upcomingGrid"></div>
    </div>
  </main>

  <!-- Listing Section (Pagination & Favorites) -->
  <section id="listingSection" class="container main-content hidden">
    <div class="listing-header">
      <button id="backBtn" class="btn btn-secondary back-btn"><i class="fa-solid fa-arrow-left"></i> Back</button>
      <h2 id="listingTitle" style="flex:1; text-align:center;">Movies</h2>
      <button id="clearFavoritesBtn" class="btn btn-danger hidden"><i class="fa-solid fa-trash"></i> Clear All</button>
    </div>
    <div class="movies-grid" id="listingGrid"></div>
    <div class="pagination" id="pagination"></div>
  </section>

  <!-- Detail Section -->
  <section id="detailSection" class="detail-section hidden">
    <div class="detail-backdrop" id="detailBackdrop"></div>
    <div class="detail-overlay"></div>
    <div class="container detail-container">
      <button id="backBtn" class="btn btn-secondary back-btn" style="margin-bottom: 20px;"><i class="fa-solid fa-arrow-left"></i> Back</button>
      <div class="detail-content" id="detailContent"></div>
    </div>
  </section>

  <!-- Trailer Modal -->
  <div id="trailerModal" class="modal">
    <div class="modal-content">
      <button id="modalClose" class="modal-close"><i class="fa-solid fa-times"></i></button>
      <div class="video-container">
        <iframe id="trailerFrame" src="" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <!-- Scroll To Top & Toast -->
  <button id="scrollTop" class="scroll-top"><i class="fa-solid fa-arrow-up"></i></button>
  <div id="toast" class="toast"></div>

  <!-- JavaScript Files -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
  </html>
